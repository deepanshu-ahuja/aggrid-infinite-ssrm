name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel an older run for the same branch/PR so stale validation does not waste runner time.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python backend/manage.py check

      - name: Transactions tests
        run: python backend/manage.py test apps.transactions

  browser:
    name: Browser validation regression
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Start Django and Vite
        run: |
          python backend/manage.py runserver 127.0.0.1:8000 > /tmp/grid-backend.log 2>&1 &
          npm run dev -- --host 127.0.0.1 > /tmp/grid-vite.log 2>&1 &

      - name: Real-grid validation regression
        run: python tests/browser/grid_validation_playwright.py

      - name: Show app logs on browser failure
        if: failure()
        run: |
          echo '--- Django ---'
          cat /tmp/grid-backend.log || true
          echo '--- Vite ---'
          cat /tmp/grid-vite.log || true
